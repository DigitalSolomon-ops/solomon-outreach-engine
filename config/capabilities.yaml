# Solomon Leadgen capability registry.
#
# Every provider the engine knows: what it can do, its FREE allowance, and how to
# call it. The engine lists Secret Manager secret NAMES (never values) and marks a
# provider "connected" when its secret exists. Connected providers join the
# rotation; the rest are shown on the Connections page as recommendations with
# the vault slot to paste the key into (slot global/<x> -> secret global-<x>).
#
# Research date: 2026-10-22. "official" = read on the vendor's own pricing/docs
# page; "unverified" = third-party source or the official page was unclear.
# Free tiers change often: the monthly provider scout re-checks these.
#
# status:   wired     = adapter exists in leadgen/providers
#           candidate = adapter not built yet (no adapter = never in the rotation)
#           skip      = researched, not worth it at $0 (kept so it isn't re-researched)
# period:   month | day | once (one-time signup credits never reset)
# priority: rotation order within a capability; lower runs first. Recurring free
#           allowances come before one-time ones, so one-time credits are kept as reserve.

operator_policy:
  paid_monthly_cap_usd: 0          # free allowances only (operator decision 2026-10-22)
  prefer_recurring_over_once: true
  # Providers with card_on_file: true can bill past the free tier and offer no
  # hard cap (HERE confirmed: no hard transaction limit on non-Enterprise plans).
  # For these the engine stops at card_safety_ratio of the free allowance, reads
  # the provider's own usage figure before each run where it has a usage API,
  # and disables the provider for the rest of the period on any billing or
  # overage signal, with an immediate email to Marcus. Not one unit past free.
  card_safety_ratio: 0.9

# Secret names. Keys added 2026-10-22 were saved in the Credentials surface as
# CUSTOM credentials named "global/<vendor>" (vault ids custom/global-<vendor>).
# Confirm the exact Secret Manager name the vault writes for a custom
# credential (likely "global-<vendor>") in services/vault/src/server.ts.
# Older keys use their own names, listed per provider under secret_aliases.
# The inventory matches a provider when ANY of secret / secret_aliases exists.

providers:

  # ------------------------------------------------------------------ discovery
  - name: google_places
    status: wired    
    secret: global-google-places
    secret_aliases: [GOOGLE_PLACES_API_KEY]   # existing key from Aug 2026; card on file via Cloud billing
    card_on_file: true
    capabilities: [discover_maps, enrich_reviews]
    free: {amount: 1000, unit: request, period: month}
    typical_cost: "Text Search Enterprise: 1 request = 1 page of up to 20 places"
    card_required: true            # Cloud billing account; $0 charged under the caps
    auth: "headers X-Goog-Api-Key + X-Goog-FieldMask (required)"
    endpoint: "POST https://places.googleapis.com/v1/places:searchText"
    docs: https://developers.google.com/maps/billing-and-pricing/pricing
    verified: official
    priority: 10
    notes: >
      Free monthly caps per SKU: Text Search Pro 5,000, Enterprise 1,000; Place Details
      Essentials 10,000, Pro 5,000, Enterprise 1,000, Enterprise+Atmosphere 1,000.
      websiteUri/nationalPhoneNumber/rating/userRatingCount are Enterprise-tier fields,
      reviews is Enterprise+Atmosphere (field-to-SKU mapping from Google's Place Details
      docs; confirm the field mask lands on the intended SKU). ~20k places/month at $0.
      MAPS TERMS: do not store Places content beyond what the terms allow. Store only
      place_id; take website/phone from the business's own site, use rating/reviews in
      the moment for the lead brief, and keep only our own derived observations.

